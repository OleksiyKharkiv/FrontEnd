name: Deploy CV site

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

# Only one deploy at a time; a newer push cancels a still-running older one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      # Build before check: paraglide-js's messages/runtime modules under
      # $lib/paraglide are generated by the Vite plugin during a real Vite
      # run (build or dev) — `svelte-kit sync` alone does NOT trigger it,
      # so `npm run check` on a fresh checkout fails with "Cannot find
      # module '$lib/paraglide/...'" before anything has ever built.
      # Reproduced locally: `rm -rf src/lib/paraglide .svelte-kit build &&
      # npm run check` fails the same way; running build first fixes it.
      - name: Build (prerendered static site)
        working-directory: site
        run: npm run build

      - name: Type-check
        working-directory: site
        run: npm run check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
